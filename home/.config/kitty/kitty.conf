# Gruvbox Dark Hard, matched to the SketchyBar compartments and the Ghostty
# reference configuration in inspo1-macos-dotfiles.

# Typography
font_family      VictorMono Nerd Font Mono
font_size        14.0

# Window surface
background_opacity  0.98
background_blur     15
window_padding_width 10
macos_titlebar_color background
# Hide the titlebar, including macOS traffic-light controls.
hide_window_decorations titlebar-only
confirm_os_window_close 0
enable_audio_bell no

# Core Gruvbox palette
foreground              #ebdbb2
background              #1d2021
cursor                  #ebdbb2
cursor_text_color       #1d2021
selection_foreground    #ebdbb2
selection_background    #665c54
url_color               #83a598

# ANSI colors
color0   #1d2021
color1   #cc241d
color2   #98971a
color3   #d79921
color4   #458588
color5   #b16286
color6   #689d6a
color7   #a89984
color8   #928374
color9   #fb4934
color10  #b8bb26
color11  #fabd2f
color12  #83a598
color13  #d3869b
color14  #8ec07c
color15  #ebdbb2

map super+c copy_to_clipboard
map super+v paste_from_clipboard
